# Static aria2 defaults for Motrix.
# Dynamic options (rpc-port, rpc-secret, dir, session, dht paths, file-allocation)
# are passed as command-line arguments and override values in this file.

################ File system ################
auto-save-interval=10
save-session-interval=30
disk-cache=64M
no-file-allocation-limit=64M
# Never enable allow-overwrite here: that path can truncate existing files.
# auto-file-renaming is HTTP(S)/FTP only: collisions get a .1/.2 suffix,
# never overwrite.
auto-file-renaming=true
# Do not hash-check globally. aria2 re-reads every piece on each unpause when
# this is true, even if a *.aria2 control file already has the bitfield —
# pausing, unplugging a disk, and clicking start then verifies terabytes.
# New BT tasks still pass check-integrity=true once (Folx-style resume).
check-integrity=false

################ Task ################
bt-detach-seed-only=true
check-certificate=false
max-file-not-found=10
max-tries=0
retry-wait=10
connect-timeout=10
timeout=10
min-split-size=1M
split=16
max-connection-per-server=16
max-concurrent-downloads=5
http-accept-gzip=true
remote-time=true
summary-interval=0
rpc-max-request-size=16M
content-disposition-default-utf8=true
follow-torrent=true
continue=true

################ BT ################
bt-enable-lpd=true
bt-hash-check-seed=true
bt-max-peers=128
bt-prioritize-piece=head
# NOTE: bt-remove-unselected-file is intentionally NOT enabled (Motrix had it).
# It deletes torrent-listed-but-unselected files on completion, which can
# destroy pre-existing user files sharing the same relative path.
bt-tracker-connect-timeout=10
bt-tracker-timeout=10
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point6=dht.transmissionbt.com:6881
enable-dht=true
enable-dht6=true
# Cache fetched torrent metadata so a magnet resolves instantly next time.
bt-save-metadata=true
# Trackerless magnets rely entirely on DHT, which dies behind fake-IP proxies
# that only tunnel TCP. HTTPS trackers keep working there, so ship a baseline
# list (mirrors what Motrix fetches at runtime from ngosang/trackerslist).
bt-tracker=udp://tracker.opentrackr.org:1337/announce,https://tracker.tamersunion.org:443/announce,udp://open.demonii.com:1337/announce,udp://tracker.openbittorrent.com:6969/announce,https://tracker.gbitt.info:443/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://explodie.org:6969/announce,http://tracker.openbittorrent.com:80/announce,udp://tracker.dler.org:6969/announce,https://tracker.lilithraws.org:443/announce,udp://open.stealth.si:80/announce
enable-peer-exchange=true
peer-agent=Transmission/3.00
peer-id-prefix=-TR3000-
